source "$HOME/.cargo/env"
export ANDROID_HOME="$HOME/Android/Sdk"
export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
export JAVA_HOME="/usr/local/sdkman/candidates/java/21.0.12+1-ms"
export PATH="$JAVA_HOME/bin:$PATH"

cd /workspaces/effectcraft

cargo build -p effectcraft-android-bridge
cargo run --quiet --bin uniffi-bindgen -- generate \
  --library target/debug/libeffectcraft_android_bridge.so \
  --language kotlin \
  --out-dir /tmp/effectcraft-uniffi \
  --config apps/effectcraft-android/uniffi.toml

cargo ndk -t arm64-v8a -o apps/effectcraft-android/android/app/src/main/jniLibs \
  build --release -p effectcraft-android-bridge

cd apps/effectcraft-android/android
./gradlew --no-daemon assembleDebug
